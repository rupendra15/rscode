services:
  postgres:
    image: postgres:16
    container_name: vistaar-biz-postgres
    environment:
      POSTGRES_DB: vistaar_biz
      POSTGRES_USER: vistaar
      POSTGRES_PASSWORD: vistaar
    ports:
      - "5432:5432"
    volumes:
      - vistaar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistaar -d vistaar_biz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: vistaar-biz-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vistaar_biz
      DB_USERNAME: vistaar
      DB_PASSWORD: vistaar
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
    environment:
      VISTAAR_BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vistaar_pgdata:
