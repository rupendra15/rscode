server:
  port: 8080

spring:
  application:
    name: vistaar-biz-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vistaar_biz}
    username: ${DB_USERNAME:vistaar}
    password: ${DB_PASSWORD:vistaar}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  session:
    days: ${SESSION_DAYS:30}
