tom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 38px;background:#faf9f6}.topRight{display:flex;gap:15px;align-items:center;color:#73747b;font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:#e8e6ff;color:#514bd1;display:grid;place-items:center;font-weight:800}.pageHead{padding:43px 48px 25px}.pageHead h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0}.pageHead p{color:var(--muted);margin:0}.content{padding:0 48px 35px}.scoreRow{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:18px}.score,.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px}.score{padding:22px;display:flex;justify-content:space-between}.score strong{display:block;font-size:55px}.score em{color:var(--green);font-style:normal;font-size:11px}.stat{padding:20px}.stat small{color:#888;font-weight:800;letter-spacing:1px}.stat b{display:block;font-size:30px;margin:12px 0 3px}.stat span{color:#777;font-size:11px}.card{padding:25px;margin-bottom:18px}.cardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card h2{margin:7px 0;font-size:22px}.rec{display:grid;grid-template-columns:38px 1fr 75px 105px;gap:18px;align-items:center;border-top:1px solid var(--line);padding:20px 0}.rec .num{color:#999}.rec h3{margin:5px 0;font-size:16px}.rec p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.impact{font-size:25px;font-weight:800}.impact small{display:block;font-size:8px;color:#999;letter-spacing:1px}.linkBtn{color:#514bd1;font-weight:800;font-size:12px;background:none;border:0}.table{overflow:auto}.row{min-width:720px;display:grid;grid-template-columns:1.1fr 1.2fr 1fr .7fr .8fr auto;gap:15px;padding:15px 5px;border-top:1px solid var(--line);align-items:center}.row span{color:#666;font-size:12px}.hot{color:var(--red)}.warm{color:var(--amber)}.auditGrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.bigScore{font-size:80px;font-weight:800;margin:15px 0}.metric{margin:21px 0}.metricTop{display:flex;justify-content:space-between}.bar{height:7px;background:#eee;border-radius:99px;margin-top:8px}.bar i{display:block;height:100%;background:var(--indigo);border-radius:99px}.expertGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.expert{padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px}.expert h2{font-size:19px;margin:20px 0 5px}.expert p{color:var(--muted)}.expertStats{display:flex;gap:45px;border-block:1px solid var(--line);padding:18px 0;margin:18px 0}.expertStats b{font-size:20px}.expertStats small{display:block;font-size:8px;color:#999;letter-spacing:1px}.task{display:grid;grid-template-columns:25px 1fr 50px;gap:14px;padding:20px 0;border-top:1px solid var(--line);align-items:center}.task input{width:18px;height:18px;accent-color:var(--indigo)}.task span{display:grid;gap:5px}.task small{font-size:9px;color:#888;letter-spacing:1px;font-weight:800}.task b{font-size:16px}.task em{font-style:normal;color:var(--muted);font-size:12px}.task.done b{text-decoration:line-through;color:#999}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.insightNum{font-size:43px;font-weight:800;margin:15px 0 4px;display:block}.up{color:var(--green);font-size:11px}.learn{padding:18px 0;border-top:1px solid var(--line);display:grid;gap:7px}.learn span{color:var(--muted)}.form{max-width:560px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:35px}.form h1{font-size:34px}.form p{color:var(--muted);line-height:1.6}.field{display:grid;gap:7px;margin:16px 0;font-size:12px;font-weight:800}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}.toast{position:fixed;right:25px;bottom:25px;background:#15161a;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0003;z-index:20}.hidden{display:none!important}@media(max-width:900px){.hero{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{display:none}.scoreRow{grid-template-columns:1fr 1fr}.score{grid-column:1/-1}.content,.pageHead{padding-left:22px;padding-right:22px}.expertGrid,.auditGrid,.insights{grid-template-columns:1fr}.moduleGrid{grid-template-columns:1fr 1fr}.strip{display:block}.strip span{display:block;margin-top:8px}}@media(max-width:600px){.links{display:none}.hero{padding:50px 20px}.hero h1{font-size:46px}.actions,.trust{flex-direction:column}.modules{padding:65px 20px}.moduleGrid{grid-template-columns:1fr}.modules h2{font-size:34px}.cta h2{font-size:35px}.scoreRow{grid-template-columns:1fr}.score{grid-column:auto}.rec{grid-template-columns:30px 1fr}.rec .impact,.rec .linkBtn{grid-column:2}.top{padding:0 20px}.pageHead{padding-top:32px}.pageHead h1{font-size:32px}}

<body><div id="app"></div>
<script>
const KEY='vistaar_biz_v2';
const defaultState={business:{name:'Gupta Furniture',category:'Furniture & Interiors',location:'Rewa, Madhya Pradesh',goal:'Generate 20 qualified leads this month'},leads:[{name:'Amit Sharma',company:'Sharma Residence',source:'Website',status:'New',temperature:'Hot',value:45000},{name:'Neha Patel',company:'Patel Interiors',source:'Referral',status:'Contacted',temperature:'Warm',value:22000},{name:'Rahul Singh',company:'Singh Homes',source:'Google',status:'Qualified',temperature:'Hot',value:68000}],tasks:[false,false,false]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||defaultState;
const recs=[['Upgrade product gallery','Create a stronger visual catalogue with room-context images, pricing cues and clear enquiry paths.',91,'AI + Expert'],['Turn unanswered reviews into trust','Respond to recent reviews and surface proof points across your profile and landing page.',88,'DIY + AI'],['Build a local lead capture page','Create one focused page for high-intent searches with WhatsApp and callback CTAs.',82,'AI']];
const experts=[['SR','Studio Rewa','Product photography','96%','4.8'],['LL','LocalLift','Local SEO','93%','4.7'],['PC','PixelCraft','Website + landing page','89%','4.6']];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function brand(){return '<a class="brand" href="#/"><span class="logo">V<i>AI</i></span><span>Vistaar-Biz</span></a>'}
function shell(active,title,sub,body){return '<div class="workspace"><aside class="side">'+brand()+'<div class="eyebrow">GROWTH COMMAND CENTRE</div>'+[['Overview','dashboard'],['Growth Audit','audit'],['Leads','leads'],['Experts','experts'],['Execution','execution'],['Insights','insights']].map(x=>'<a class="nav '+(active===x[0]?'active':'')+'" href="#/'+x[1]+'">'+x[0]+'</a>').join('')+'<div class="businessCard"><div class="eyebrow">BUSINESS</div><b>'+esc(state.business.name)+'</b><span>'+esc(state.business.location)+'</span><button class="btn" onclick="location.hash='/onboarding'">Edit business</button></div></aside><main class="main"><header class="top"><a href="#/">← Website</a><div class="topRight"><span>● AI ready</span><span class="avatar">'+esc(state.business.name.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</span></div></header><section class="pageHead"><div class="eyebrow">'+active.toUpperCase()+'</div><h1>'+title+'</h1><p>'+sub+'</p></section><div class="content">'+body+'</div></main></div>'}
function home(){return '<div><nav class="landingNav">'+brand()+'<div class="links"><a href="#/audit">Audit</a><a href="#/dashboard">Platform</a><a href="#/experts">Experts</a><a href="#/onboarding">Get started</a></div></nav><section class="hero"><div><span class="badge">AI-POWERED BUSINESS GROWTH</span><h1>Know where to grow.<br><span>Know what to do next.</span></h1><p>Vistaar-Biz turns your business data, online presence and growth goals into a clear plan — then helps you execute it.</p><div class="actions"><a class="btn primary" href="#/onboarding">Start your growth audit →</a><a class="btn" href="#/dashboard">Open command centre</a></div><div class="trust"><span>✓ Local-business focused</span><span>✓ AI + human expertise</span><span>✓ Action, not reports</span></div></div><div class="heroMock"><div class="mockTop"><b>Vistaar-Biz</b><small>AI GROWTH MANAGER</small></div><div class="mockScore"><div><small>GROWTH SCORE</small><b>68</b><div style="color:#7bd9a9;font-size:11px">↑ 8 this month</div></div><div class="ring">68</div></div><div class="mockGrid"><div><small>VISIBILITY</small><b>78</b></div><div><small>TRUST</small><b>64</b></div><div><small>CONVERSION</small><b>53</b></div></div><div class="mockAction"><small>AI PRIORITY</small><b>Upgrade product gallery · 91 impact</b></div></div></section><div class="strip"><b>One system for the whole growth journey.</b><span>Audit → Diagnose → Execute → Convert → Learn</span></div><section class="modules"><div class="eyebrow">THE PLATFORM</div><h2>From “I need more customers”<br>to a measurable growth system.</h2><div class="moduleGrid"><a class="module" href="#/audit"><small>01</small><h3>Growth Audit →</h3><p>See exactly where your business is strong, weak and leaking opportunities.</p></a><a class="module" href="#/dashboard"><small>02</small><h3>AI Growth Manager →</h3><p>Get priorities ranked by impact and execution reality.</p></a><a class="module" href="#/execution"><small>03</small><h3>Execution Studio →</h3><p>Turn recommendations into tasks, assets and expert briefs.</p></a><a class="module" href="#/leads"><small>04</small><h3>Leads & Conversion →</h3><p>Capture, qualify and move opportunities through a simple pipeline.</p></a><a class="module" href="#/experts"><small>05</small><h3>Expert Network →</h3><p>Match the right local specialist when execution needs a human.</p></a><a class="module" href="#/insights"><small>06</small><h3>Measure & Learn →</h3><p>Track outcomes and feed what worked into the next decision.</p></a></div></section><section class="cta"><div class="eyebrow" style="color:#aaa">READY WHEN YOU ARE</div><h2>Build growth around decisions,<br>not guesswork.</h2><a class="btn primary" href="#/onboarding" style="background:#fff;color:#111">Create your business workspace →</a></section></div>'}
function dashboard(){let total=state.leads.reduce((a,x)=>a+x.value,0);return shell('Overview','Your growth at a glance.','Vistaar-Biz found three opportunities worth acting on now.','<div class="scoreRow"><div class="score"><div><div class="eyebrow">GROWTH SCORE</div><strong>68<span style="font-size:13px;color:#999">/100</span></strong><em>↑ 8 points this month</em></div><div class="ring">68</div></div>'+[['VISIBILITY','78','Strong'],['TRUST','64','Improve'],['CONVERSION','53','Priority'],['LEAD ENGINE','39','Critical']].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b><span>'+x[2]+'</span></div>').join('')+'</div><section class="card"><div class="cardHead"><div><div class="eyebrow">WHAT TO DO NEXT</div><h2>Highest-value opportunities</h2></div><button class="btn indigo" onclick="toast('AI diagnosis: fix product proof, trust and lead capture in that order.')">✦ Ask Vistaar-Biz AI</button></div>'+recs.map((r,i)=>'<div class="rec"><div class="num">0'+(i+1)+'</div><div><div class="eyebrow">'+r[3]+'</div><h3>'+r[0]+'</h3><p>'+r[1]+'</p></div><div class="impact">'+r[2]+'<small>IMPACT</small></div><a class="linkBtn" href="#/execution">Take action →</a></div>').join('')+'</section><section class="card"><div class="cardHead"><div><div class="eyebrow">LEAD PIPELINE</div><h2>Customer opportunities</h2></div><a class="linkBtn" href="#/leads">View all →</a></div><div class="table">'+state.leads.map(l=>'<div class="row"><b>'+esc(l.name)+'</b><span>'+esc(l.company)+'</span><span>'+esc(l.source)+'</span><em class="'+l.temperature.toLowerCase()+'">'+l.temperature+'</em><span>'+l.status+'</span><strong>₹'+l.value.toLocaleString('en-IN')+'</strong></div>').join('')+'</div><div style="text-align:right;padding-top:17px;border-top:1px solid var(--line);margin-top:5px;color:#777">Pipeline value <b style="color:#111">₹'+total.toLocaleString('en-IN')+'</b></div></section>')}
function audit(){let ms=[['Discoverability',78,'Strong'],['Trust & reputation',64,'Improve'],['Content & visuals',46,'Priority'],['Conversion',53,'Priority'],['Lead generation',39,'Critical']];return shell('Growth Audit','See what is holding growth back.','A practical baseline across visibility, trust, content, conversion and lead generation.','<div class="auditGrid"><section class="card"><div class="eyebrow">OVERALL GROWTH SCORE</div><div class="bigScore">68<small style="font-size:15px;color:#999">/100</small></div><p style="color:var(--muted);line-height:1.7">Your strongest asset is discoverability. Your biggest near-term opportunity is turning attention into qualified enquiries.</p><a class="btn primary" href="#/execution">Build my action plan →</a></section><section class="card"><div class="eyebrow">AUDIT BREAKDOWN</div>'+ms.map(m=>'<div class="metric"><div class="metricTop"><b>'+m[0]+'</b><span>'+m[2]+' · '+m[1]+'</span></div><div class="bar"><i style="width:'+m[1]+'%"></i></div></div>').join('')+'</section></div><section class="card"><div class="eyebrow">AI DIAGNOSIS</div><h2>The problem is not visibility alone.</h2><p style="color:var(--muted);line-height:1.7;font-size:15px">You are being discovered, but weak visual proof, inconsistent trust signals and an underdeveloped lead path are reducing conversion. Fix those in that order before spending heavily on acquisition.</p></section>')}
function leads(){return shell('Leads','Turn interest into revenue.','Capture, qualify and follow up on customer opportunities.','<section class="card"><div class="cardHead"><div><div class="eyebrow">PIPELINE</div><h2>'+state.leads.length+' leads · ₹'+state.leads.reduce((a,x)=>a+x.value,0).toLocaleString('en-IN')+' potential</h2></div><button class="btn primary" onclick="addLead()">+ Add lead</button></div><div class="table">'+state.leads.map((l,i)=>'<div class="row"><b>'+esc(l.name)+'</b><span>'+esc(l.company)+'</span><span>'+esc(l.source)+'</span><em class="'+l.temperature.toLowerCase()+'">'+l.temperature+'</em><span>'+l.status+'</span><strong>₹'+l.value.toLocaleString('en-IN')+'</strong><button class="btn" onclick="advanceLead('+i+')">Advance</button></div>').join('')+'</div></section>')}
function expertsPage(){return shell('Experts','Bring in the right specialist.','Vistaar-Biz matches execution needs with trusted local providers.','<div class="expertGrid">'+experts.map(e=>'<article class="expert"><div style="display:flex;justify-content:space-between"><span class="avatar">'+e[0]+'</span><span style="color:var(--green);font-size:9px;font-weight:800">✓ VERIFIED</span></div><h2>'+e[1]+'</h2><p>'+e[2]+' · Rewa</p><div class="expertStats"><b>'+e[3]+'<small>MATCH</small></b><b>★ '+e[4]+'<small>RATING</small></b></div><button class="btn" onclick="toast('Proposal request sent to '+e[1]+'')">Request a proposal →</button></article>').join('')+'</div>')}
function execution(){return shell('Execution','Know what to do next — and do it.','Your highest-impact recommendations converted into concrete work.','<section class="card"><div class="cardHead"><div><div class="eyebrow">7-DAY GROWTH PLAN</div><h2>Three moves. One week.</h2></div><span class="badge">AI PRIORITISED</span></div>'+recs.map((r,i)=>'<label class="task"><input type="checkbox" '+(state.tasks[i]?'checked':'')+' onchange="toggleTask('+i+')"><span><small>DAY '+(i+1)+' · '+r[3]+'</small><b>'+r[0]+'</b><em>'+r[1]+'</em></span><strong>'+r[2]+'</strong></label>').join('')+'</section><section class="card"><div class="eyebrow">EXPERT BRIEF</div><h2>Product photography brief</h2><p style="color:var(--muted);line-height:1.7">Capture 12 hero products, 6 room-context scenes and 3 vertical videos. Include clear enquiry CTA and Rewa location context.</p><button class="btn primary" onclick="toast('Brief copied — ready to send to an expert')">Copy brief →</button></section>')}
function insights(){let done=state.tasks.filter(Boolean).length;return shell('Insights','Measure what changed.','Growth becomes smarter when actions are connected to outcomes.','<div class="insights"><div class="card"><div class="eyebrow">LEADS</div><strong class="insightNum">'+state.leads.length+'</strong><p>Captured opportunities</p><span class="up">↑ 18% vs baseline</span></div><div class="card"><div class="eyebrow">PIPELINE VALUE</div><strong class="insightNum">₹'+state.leads.reduce((a,x)=>a+x.value,0).toLocaleString('en-IN')+'</strong><p>Potential revenue</p><span class="up">↑ 12% vs baseline</span></div><div class="card"><div class="eyebrow">EXECUTION</div><strong class="insightNum">'+done+'/3</strong><p>Priority actions complete</p><span class="up">Keep the loop moving</span></div></div><section class="card"><div class="eyebrow">LEARNING LOOP</div><h2>What Vistaar-Biz is learning</h2><div class="learn"><b>1. Discoverability is healthy</b><span>Don't over-invest in awareness before conversion is fixed.</span></div><div class="learn"><b>2. Visual proof is the bottleneck</b><span>Better product context should improve enquiry confidence.</span></div><div class="learn"><b>3. Lead capture needs a dedicated path</b><span>A focused local landing page is the next measurable experiment.</span></div></section>')}
function onboarding(){return '<div style="min-height:100vh;padding:30px;display:grid;place-items:center"><div class="form"><a class="brand" href="#/">'+brand().replace('href="#/"','href="#/"')+'</a><div class="eyebrow" style="margin-top:35px">CREATE YOUR WORKSPACE</div><h1>Let's understand your business.</h1><p>Vistaar-Biz uses this baseline to build your first growth plan.</p><form onsubmit="startBusiness(event)"><label class="field">Business name<input id="bn" required value="'+esc(state.business.name)+'"></label><label class="field">Category<input id="bc" required value="'+esc(state.business.category)+'"></label><label class="field">Location<input id="bl" required value="'+esc(state.business.location)+'"></label><label class="field">Primary goal<select id="bg"><option>Generate more qualified leads</option><option>Increase local visibility</option><option>Improve conversion</option><option>Build stronger online trust</option></select></label><button class="btn primary" style="width:100%">Create growth workspace →</button></form></div></div>'}
function route(){let p=location.hash.slice(1)||'/';let h=p==='/'?home():p==='/dashboard'?dashboard():p==='/audit'?audit():p==='/leads'?leads():p==='/experts'?expertsPage():p==='/execution'?execution():p==='/insights'?insights():p==='/onboarding'?onboarding():home();document.getElementById('app').innerHTML=h;window.scrollTo(0,0)}
function startBusiness(e){e.preventDefault();state.business={name:bn.value,category:bc.value,location:bl.value,goal:bg.value};save();location.hash='/dashboard';toast('Workspace created')}
function toggleTask(i){state.tasks[i]=!state.tasks[i];save();route();toast(state.tasks[i]?'Action completed':'Action reopened')}
function advanceLead(i){let f=['New','Contacted','Qualified','Won'];state.leads[i].status=f[Math.min(f.indexOf(state.leads[i].status)+1,3)];save();route();toast('Lead moved to '+state.leads[i].status)}
function addLead(){let name=prompt('Customer name');if(!name)return;let value=Number(prompt('Potential value (₹)','25000')||0);state.leads.unshift({name,company:'New opportunity',source:'Manual',status:'New',temperature:'Warm',value});save();route()}
function toast(t){let x=document.querySelector('.toast');if(!x){x=document.createElement('div');x.className='toast';document.body.appendChild(x)}x.textContent=t;setTimeout(()=>x.remove(),2400)}
