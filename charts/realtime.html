<!doctype html>
<html><head><meta charset="utf-8"><title>Rupendra NIFTY Live Chart</title><style>body{margin:0;background:#070b12;color:#e8eef7;font:14px Arial}#wrap{padding:18px}canvas{width:100%;height:520px;background:#0b111b;border:1px solid #263243;border-radius:12px}h1{font-size:22px} .meta{color:#9eacc0;margin-bottom:12px}</style></head><body><div id="wrap"><h1>NIFTY 50 — Live Market Chart</h1><div class="meta" id="meta">Connecting to cloud market data…</div><canvas id="c" width="1400" height="520"></canvas></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let pts=[];const url='../data/market_snapshot.json';
function draw(){x.clearRect(0,0,c.width,c.height);x.strokeStyle='#263243';for(let i=1;i<6;i++){let y=i*c.height/6;x.beginPath();x.moveTo(50,y);x.lineTo(c.width-20,y);x.stroke()}if(pts.length<2)return;let a=pts.map(p=>p.v),lo=Math.min(...a),hi=Math.max(...a),pad=Math.max((hi-lo)*.15,1);lo-=pad;hi+=pad;x.strokeStyle='#57d6a0';x.lineWidth=3;x.beginPath();pts.forEach((p,i)=>{let xx=50+i*(c.width-80)/(Math.max(pts.length-1,1)),yy=20+(hi-p.v)*((c.height-45)/(hi-lo));i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.fillStyle='#9eacc0';x.font='14px Arial';x.fillText(hi.toFixed(2),8,30);x.fillText(lo.toFixed(2),8,c.height-15)}
async function tick(){try{let r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});let d=await r.json();let n=Number(d.nifty??d.market?.nifty);if(Number.isFinite(n)){pts.push({v:n,t:new Date()});if(pts.length>240)pts.shift();document.getElementById('meta').textContent='NIFTY '+n.toFixed(2)+' • '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' IST • Cloud data refresh';draw()}}catch(e){document.getElementById('meta').textContent='Waiting for fresh cloud market data…'}}tick();setInterval(tick,5000);</script></body></html>
