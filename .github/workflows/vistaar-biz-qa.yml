name: Vistaar-Biz QA

on:
  push:
    branches: [vistaar-biz]
  pull_request:
    branches: [vistaar-biz]

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/vistaar_biz
      DB_USERNAME: vistaar
      DB_PASSWORD: vistaar
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      VISTAAR_BACKEND_URL: http://127.0.0.1:8080
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vistaar_biz
          POSTGRES_USER: vistaar
          POSTGRES_PASSWORD: vistaar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vistaar -d vistaar_biz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: vistaar-biz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java backend
        working-directory: vistaar-biz/backend
        run: mvn -q -DskipTests package

      - name: Start Java backend
        working-directory: vistaar-biz/backend
        run: |
          java -jar target/vistaar-biz-api-1.0.0.jar > /tmp/vistaar-backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Java backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vistaar-backend.log
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build application once
        run: npm run build

      - name: QA 1 — homepage smoke
        run: npx playwright test -g "loads homepage without console/page errors"

      - name: QA 2 — onboarding smoke
        run: npx playwright test -g "loads onboarding without console/page errors"

      - name: QA 3 — dashboard smoke
        run: npx playwright test -g "loads dashboard without console/page errors"

      - name: QA 4 — homepage primary interactions
        run: npx playwright test -g "homepage primary interactions work"

      - name: QA 5 — readiness questionnaire
        run: npx playwright test -g "readiness questionnaire progresses and returns a result"

      - name: QA 6 — onboarding and dashboard render
        run: npx playwright test -g "onboarding and dashboard render"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vistaar-biz-qa-report
          path: |
            vistaar-biz/qa-report
            vistaar-biz/test-results
          if-no-files-found: ignore
