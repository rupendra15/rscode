name: Vistaar-Biz QA

on:
  push:
    branches: [vistaar-biz]
  pull_request:
    branches: [vistaar-biz]

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vistaar-biz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build application
        run: npm run build

      - name: Run browser QA
        run: npm run qa

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vistaar-biz-qa-report
          path: |
            vistaar-biz/qa-report
            vistaar-biz/test-results
          if-no-files-found: ignore
