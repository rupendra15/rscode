name: Free NIFTY Intelligence Engine

on:
  schedule:
    # GitHub scheduled workflows use UTC. This covers the Indian market window
    # plus a small pre/post-market buffer on weekdays. Minimum interval is 5m.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-intelligence-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install market dependencies
        run: pip install -r requirements-market.txt

      - name: Run intelligence engine
        run: python scripts/free_market_snapshot.py

      - name: Persist snapshot and research history
        run: |
          git config user.name 'Rupendra NIFTY Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json data/history.json
          git diff --cached --quiet || git commit -m 'Update NIFTY intelligence snapshot'
          git push
