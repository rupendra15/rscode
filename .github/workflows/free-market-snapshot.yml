name: Free NIFTY Intelligence Engine

on:
  push:
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0-40/5 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-intelligence-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market dependencies
        run: pip install -r requirements-market.txt
      - name: Run market-hours intelligence engine v3
        run: python scripts/intelligence_engine_v3.py
      - name: Persist intelligence state
        run: |
          git config user.name 'Rupendra NIFTY Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json data/history.json data/trade_journal.json
          git diff --cached --quiet || git commit -m 'Update market-hours intelligence v3'
          git push
