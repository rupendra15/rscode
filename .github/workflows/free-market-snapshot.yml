name: Free NIFTY Intelligence Engine

on:
  push:
    paths-ignore:
      - 'data/**'
  schedule:
    # Research/evidence runs continuously on weekdays. Trading decisions are
    # permitted only inside the NSE equity-derivatives regular session.
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-intelligence-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market dependencies
        run: pip install -r requirements-market.txt
      - name: Run cloud intelligence engine
        working-directory: ${{ github.workspace }}/scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python intelligence_engine_v4.py
      - name: Persist intelligence state safely
        run: |
          git config user.name 'Rupendra NIFTY Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json data/history.json data/trade_journal.json
          if git diff --cached --quiet; then
            echo 'No intelligence-state changes to persist.'
            exit 0
          fi
          git commit -m 'Update cloud intelligence state'
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master && git push origin HEAD:master && exit 0
            git rebase --abort || true
            sleep 3
            git fetch origin master
            git rebase origin/master
          done
          echo 'Unable to push intelligence state after retries.'
          exit 1
