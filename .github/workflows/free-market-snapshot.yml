name: Free NIFTY Market Snapshot

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-market.txt
      - run: python scripts/free_market_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name 'NIFTY Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json
          git diff --cached --quiet || git commit -m 'Update market snapshot'
          git push
