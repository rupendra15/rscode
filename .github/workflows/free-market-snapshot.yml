name: Free NIFTY Intelligence Engine

on:
  push:
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-intelligence-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market dependencies
        run: pip install -r requirements-market.txt
      - name: Run v5 ensemble intelligence engine
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/intelligence_engine_v5.py
      - name: Track validated recommendations and actual P/L
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/trade_tracker.py
      - name: Verify live snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/market_snapshot.json')
          d=json.loads(p.read_text())
          print('engine_version=', d.get('engine_version'))
          print('ist_time=', d.get('ist_time'))
          print('market_status=', d.get('market_status'))
          print('nifty=', d.get('nifty'))
          print('vix=', d.get('vix'))
          print('data_quality=', d.get('data_quality'))
          if not d.get('ist_time'):
              raise SystemExit('Snapshot timestamp missing')
          PY
      - name: Persist intelligence state safely
        run: |
          git config user.name 'Rupendra NIFTY Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_snapshot.json data/history.json data/trade_journal.json
          if git diff --cached --quiet; then
            echo 'No intelligence-state changes to persist.'
            exit 0
          fi
          git commit -m 'Update v5 cloud intelligence state'
          for attempt in 1 2 3 4; do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then exit 0; fi
            git rebase --abort || true
            sleep 4
          done
          echo 'Unable to push intelligence-state changes after retries.'
          exit 1
