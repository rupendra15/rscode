name: NIFTY Continuous Learning Research

on:
  # Re-evaluate historical patterns and closed-trade diagnostics continuously.
  # This never emits a live BUY/SELL decision; decisions remain session-gated.
  schedule:
    - cron: '0 * * * 1-5'
    - cron: '0 */6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-market.txt
      - name: Update historical pattern diagnostics
        run: python scripts/learning_engine.py
      - name: Persist learning state
        run: |
          git config user.name 'Rupendra NIFTY Learning Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning_state.json
          git diff --cached --quiet || git commit -m 'Update continuous NIFTY learning diagnostics'
          git push
